# Isolated restore only: no application, Worker, published ports, or source volumes.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: restore
      POSTGRES_USER: restore
      POSTGRES_PASSWORD: restore_isolated_only
    volumes:
      - restore_postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U restore -d restore']
      interval: 2s
      timeout: 5s
      retries: 30
  minio:
    image: sara-object-store:dev
    command: server /data
    environment:
      MINIO_ROOT_USER: restore_only
      MINIO_ROOT_PASSWORD: restore_isolated_only
    volumes:
      - restore_objects:/data
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://localhost:9000/minio/health/ready']
      interval: 2s
      timeout: 5s
      retries: 30
  verifier:
    image: sara-knowledge-server-api:latest
    environment:
      DATABASE_URL: postgresql://restore:restore_isolated_only@postgres:5432/restore
      MINIO_ENDPOINT: minio
      MINIO_PORT: 9000
      MINIO_ACCESS_KEY: restore_only
      MINIO_SECRET_KEY: restore_isolated_only
      MINIO_BUCKET: ${RESTORE_BUCKET:-sara-assets}
volumes:
  restore_postgres:
  restore_objects:
